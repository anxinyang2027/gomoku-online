<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>排行榜 · 五子棋</title>
  <link rel="stylesheet" href="css/style.css?v=22">
</head>
<body>

  <header class="top-bar">
    <h1 class="top-bar__title">排行榜</h1>
  </header>

  <main class="page">
    <!-- M3.10：榜单（api.getRank 取数，一期 mock 为空 → 空态） -->
    <ul class="rank-list" id="rank-list"></ul>

    <!-- "我的排名"底栏：三期登录后填真实数据 -->
    <div class="my-rank">我的排名：—</div>
  </main>

  <!-- 底部导航：common.js 读 data-nav 自动渲染（M0.7） -->
  <nav class="tab-bar" data-nav="rank"></nav>

  <!-- js 统一放 body 末尾，按依赖顺序：api（数据）→ common（组件） -->
  <script src="js/api.js"></script>
  <script src="js/common.js?v=2"></script>
  <script>
    // M3.10：渲染榜单或空态；行结构（名次/头像/昵称/积分，前三名视觉区分）
    // 已按二期真实数据形状写好，后端接上即亮
    Api.getRank().then((list) => {
      const ul = document.getElementById('rank-list');
      if (!list || !list.length) {
        ul.outerHTML = '<div class="empty"><p>暂无数据</p><p class="empty__hint">等待后端接入</p></div>';
        return;
      }
      list.forEach((u, i) => {
        const li = document.createElement('li');
        li.className = 'rank-row' + (i < 3 ? ' rank-row--top' : '');
        // 头像：后端 avatarImg（shop_item.img）缺省/加载失败都回退到首字圆圈
        const fallback = u.name.charAt(0);
        const avatarHtml = u.avatarImg
          ? '<img src="' + u.avatarImg + '" alt="" loading="lazy" ' +
            'onerror="this.outerHTML=\'' + fallback + '\'">'
          : fallback;
        li.innerHTML =
          '<span class="rank-row__no">' + (i + 1) + '</span>' +
          '<span class="rank-row__avatar" aria-hidden="true">' + avatarHtml + '</span>' +
          '<span class="rank-row__name">' + u.name + '</span>' +
          '<span class="rank-row__score">' + u.score + ' 分</span>';
        ul.appendChild(li);
      });
    }).catch(() => toast('加载失败，请稍后再试'));

    // H3：我的排名底栏（M3.10 数据位）
    if (Api.isLogin()) {
      Api.getRankMe().then((r) => {
        document.querySelector('.my-rank').textContent =
          '我的排名：' + r.rank + ' · ' + r.score + ' 分';
      }).catch(() => {});
    }
  </script>

</body>
</html>

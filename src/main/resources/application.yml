server:
  port: 8080

spring:
  web:
    resources:
      cache:
        cachecontrol:
          no-cache: true
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://127.0.0.1:3306/gomoku?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
  # K4c：CI 里用 H2 内存库跑单测（MySQL 兼容模式），本地开发默认不激活
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false

gomoku:
  jwt:
    # 密钥兜底顺序：环境变量 → dev profile 固定值；prod 缺失直接启动失败（K4a）
    secret: ${GOMOKU_JWT_SECRET:${gomoku.jwt.secret-dev:}}
    expire-hours: 24

logging:
  file:
    name: ${GOMOKU_LOG_FILE:app.log}
